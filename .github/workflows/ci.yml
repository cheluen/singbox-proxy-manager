name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.11"
  GOVULNCHECK_VERSION: "v1.7.0"
  NODE_VERSION: "22"
  GOTOOLCHAIN: "local"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  release-plan:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.plan.outputs.run_full }}
      should_release: ${{ steps.plan.outputs.should_release }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      app_version: ${{ steps.plan.outputs.app_version }}
      is_prerelease: ${{ steps.plan.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Plan CI and release
        id: plan
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import importlib.util
          import os
          from pathlib import Path
          import subprocess
          import sys

          spec = importlib.util.spec_from_file_location("gen", Path("scripts/generate-release-notes.py"))
          gen = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gen)

          ref = os.environ["GITHUB_REF"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          event = os.environ["GITHUB_EVENT_NAME"]

          existing_tags = set(
              subprocess.run(["git", "tag", "--list", "v*"], check=True, capture_output=True, text=True).stdout.splitlines()
          )
          should_release = False
          run_full = True
          if event == "push" and ref == "refs/heads/main":
              before, after = os.environ["PUSH_BEFORE"], os.environ["PUSH_AFTER"]
              path = "internal/version/version.txt"
              if before and before != "0" * 40:
                  old = subprocess.run(["git", "show", f"{before}:{path}"], capture_output=True, text=True)
                  new = subprocess.check_output(["git", "show", f"{after}:{path}"], text=True)
                  run_full = old.returncode != 0 or old.stdout.strip() != new.strip() or f"v{new.strip()}" not in existing_tags
          print(f"run_full={str(run_full).lower()}")
          if ref.startswith("refs/tags/v"):
              release_tag = ref_name
              app_version = release_tag[1:]
              should_release = True
          else:
              app_version = Path("internal/version/version.txt").read_text(encoding="utf-8").strip()
              release_tag = f"v{app_version}"
              if run_full and event == "push" and ref == "refs/heads/main" and release_tag not in existing_tags:
                  should_release = True

          try:
              is_stable = gen.version_key(app_version)[3]
          except ValueError as err:
              print(f"::error::{err}", file=sys.stderr)
              sys.exit(1)

          is_prerelease = not is_stable
          print(f"app_version={app_version}")
          print(f"release_tag={release_tag}")
          print(f"should_release={'true' if should_release else 'false'}")
          print(f"is_prerelease={'true' if is_prerelease else 'false'}")
          PY

  build-test-kernel:
    needs: [release-plan]
    if: needs.release-plan.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 使用修复后的 Go 重编译固定版本内核
        run: |
          ./scripts/build-sing-box.sh "${RUNNER_TEMP}/sing-box"
          "${RUNNER_TEMP}/sing-box" version

      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-test-kernel
          path: ${{ runner.temp }}/sing-box
          retention-days: 1
          overwrite: true

  lint-backend:
    needs: [release-plan]
    if: needs.release-plan.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          working-directory: ./
          args: ./backend/... ./internal/...

  vulnerability-backend:
    needs: [build-test-kernel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install pinned govulncheck
        run: GOBIN="${RUNNER_TEMP}/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Build backend vulnerability scan target
        run: CGO_ENABLED=0 go build -o "${RUNNER_TEMP}/sbpm-govulncheck-target" ./backend

      - name: Scan reachable backend vulnerabilities
        run: |
          "${RUNNER_TEMP}/bin/govulncheck" ./backend/... ./internal/...
          "${RUNNER_TEMP}/bin/govulncheck" -mode=binary "${RUNNER_TEMP}/sbpm-govulncheck-target"

      - uses: actions/download-artifact@v4
        with:
          name: sing-box-test-kernel
          path: ${{ runner.temp }}/sing-box-kernel

      - name: 扫描内核并阻断标准库漏洞回归
        run: |
          binary="${RUNNER_TEMP}/sing-box-kernel/sing-box"
          ./scripts/verify-go-build.sh "${binary}"
          if ! "${RUNNER_TEMP}/bin/govulncheck" -mode=binary -json "${binary}" > "${RUNNER_TEMP}/sing-box-vulnerabilities.json"; then
            echo '内核 govulncheck 扫描失败，阻断发布' >&2
            exit 1
          fi
          if grep -Eq '"osv": "GO-2026-(6809|6859)"' "${RUNNER_TEMP}/sing-box-vulnerabilities.json"; then
            echo 'CVE-2026-111943 或 CVE-2026-97054 仍然存在' >&2
            exit 1
          fi

  lint-frontend:
    needs: [release-plan]
    if: needs.release-plan.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

  audit-frontend-production:
    needs: [release-plan]
    if: needs.release-plan.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend

  test-backend:
    needs: [build-test-kernel]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sbpm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sbpm_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 127.0.0.1:3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 3s --health-retries 30
      libsql:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        env:
          SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
        ports:
          - 127.0.0.1:18080:8080
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - uses: actions/download-artifact@v4
        with:
          name: sing-box-test-kernel
          path: ${{ runner.temp }}/sing-box-kernel

      - name: 校验并启用重编译内核
        run: |
          binary="${RUNNER_TEMP}/sing-box-kernel/sing-box"
          chmod +x "${binary}"
          ./scripts/verify-go-build.sh "${binary}"
          echo "SINGBOX_TEST_BINARY=${binary}" >> "${GITHUB_ENV}"

      - name: Build backend
        run: CGO_ENABLED=0 go build -o singbox-proxy-manager ./backend

      - name: Run backend tests
        run: go test -race -count=1 ./backend/... ./internal/... -v

      - name: Validate database upgrades and mutations against real services
        run: |
          set -euo pipefail
          for database in 'postgres://postgres@127.0.0.1:5432/sbpm_test?sslmode=disable' 'mysql://root@127.0.0.1:3306/sbpm_test'; do
            SBPM_INTEGRATION_DATABASE_URL="$database" go test -count=1 ./backend -run '^TestDatabaseURLIntegration$'
            SBPM_INTEGRATION_DATABASE_URL="$database" go test -count=1 ./backend/services -run '^TestObservabilityRemoteDatabase$'
            SBPM_BATCH_IMPORT_INTEGRATION_DATABASE_URL="$database" go test -count=1 ./backend/api -run RemoteDatabase
          done
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:18080/health
          export SBPM_INTEGRATION_TURSO_URL=http://127.0.0.1:18080
          export SBPM_INTEGRATION_TURSO_TOKEN="$(openssl rand -hex 24)"
          go test -count=1 ./backend/services -run '^TestObservabilityRemoteDatabase$'
          SBPM_TEST_OPEN_LIBSQL_URL="$SBPM_INTEGRATION_TURSO_URL" go test -race -count=1 ./backend/services -run '^TestObservabilityLibSQLCommitInterruption$'
          SBPM_BATCH_IMPORT_INTEGRATION_TURSO_URL="$SBPM_INTEGRATION_TURSO_URL" SBPM_BATCH_IMPORT_INTEGRATION_TURSO_TOKEN="$SBPM_INTEGRATION_TURSO_TOKEN" go test -count=1 ./backend/api -run RemoteDatabase
          go test -count=1 ./backend -run '^TestTursoDatabaseIntegration$'

      - name: Test release notes and GHCR cleanup scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  test-frontend-build:
    runs-on: ubuntu-latest
    needs: [release-plan]
    if: needs.release-plan.outputs.run_full == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: 校验前端核心逻辑与可访问性
        run: npm run test:core && npm run audit
        working-directory: frontend

      - name: Verify global version consistency
        run: npm run test:version-sync
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          APP_VERSION: ${{ needs.release-plan.outputs.app_version }}

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  test-frontend-e2e:
    needs: [release-plan]
    if: needs.release-plan.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        script:
          - test:e2e:brand
          - test:e2e:dnd
          - test:e2e:dnd-virtual
          - test:e2e:preserve-ports
          - test:e2e:batch-import
          - test:e2e:batch-auth
          - test:e2e:batch-check-ip-live
          - test:e2e:check-failed-ui
          - test:e2e:groups-policy-ui
          - test:e2e:inbound-https-ui
          - test:e2e:connections-logs-ui
          - test:e2e:outbound-dedup
          - test:e2e:remark
          - test:e2e:filter
          - test:e2e:tcp-reuse-ui
          - test:e2e:nodes-viewport
          - test:e2e:column-resize
          - test:e2e:runtime-restart
          - test:e2e:version-refresh
          - test:e2e:wireguard-ui
          - test:e2e:version-update
          - test:e2e:nodeform-config-preservation
          - test:e2e:dashboard-concurrency-replace
          - test:e2e:upstream-proxy
          - test:e2e:session
          - test:e2e:language-copy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Resolve browser path
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "::error::No Chrome/Chromium executable found on runner."
            exit 1
          fi

      - name: Run frontend regression
        run: npm run ${{ matrix.script }}
        working-directory: frontend

  test-upstream-full-stack:
    needs: [release-plan, build-test-kernel, test-frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_VERSION: ${{ needs.release-plan.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: sing-box-test-kernel
          path: ${{ runner.temp }}/sing-box-kernel

      - name: 校验并启用重编译内核
        run: |
          binary="${RUNNER_TEMP}/sing-box-kernel/sing-box"
          chmod +x "${binary}"
          ./scripts/verify-go-build.sh "${binary}"
          echo "SINGBOX_TEST_BINARY=${binary}" >> "${GITHUB_ENV}"

      - name: Build backend for full-stack test
        run: CGO_ENABLED=0 go build -tags frontend_dist -ldflags="-X sb-proxy/internal/version.rawVersion=${APP_VERSION}" -o "${RUNNER_TEMP}/sbpm-upstream-e2e-backend" ./backend

      - name: Resolve browser path
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "::error::No Chrome/Chromium executable found on runner."
            exit 1
          fi

      - name: Run live upstream full-stack regression
        run: npm run test:e2e:full-stack-upstream
        working-directory: frontend
        env:
          SBPM_E2E_BACKEND_BINARY: ${{ runner.temp }}/sbpm-upstream-e2e-backend

      - name: 运行真实协议导入与编辑端到端回归
        run: npm run test:e2e:full-stack-protocol-import
        working-directory: frontend
        env:
          SBPM_E2E_BACKEND_BINARY: ${{ runner.temp }}/sbpm-upstream-e2e-backend

  test-system-local-deploy:
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - vulnerability-backend
      - lint-frontend
      - audit-frontend-production
      - test-backend
      - test-frontend-build
      - test-frontend-e2e
      - test-upstream-full-stack
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sing-box-test-kernel
          path: ${{ runner.temp }}/sing-box-kernel

      - name: Prepare .env for system test
        run: |
          cp .env.example .env
          cat <<'EOT' >> .env
          COMPOSE_PROFILES=local
          PORT=38080
          ACCEPT_USER_AGREEMENT=true
          ADMIN_PASSWORD=system-test-password
          CONFIG_VOLUME_HOST=./config-ci
          TZ=UTC
          EOT
          mkdir -p config-ci

      - name: Build local image
        run: docker compose --profile local build sb-proxy-local

      - name: 验证容器拒绝未同意用户协议的启动
        run: |
          exit_code=0
          output=$(timeout 20s docker compose --profile local run --rm --no-deps -T \
            -e ACCEPT_USER_AGREEMENT=false sb-proxy-local </dev/null 2>&1) || exit_code=$?
          printf '%s\n' "$output"
          test "$exit_code" -eq 1
          for guidance in 'User agreement not accepted' 'ACCEPT_USER_AGREEMENT=true' 'ADMIN_PASSWORD' 'USER_AGREEMENT.md'; do
            grep -Fq "$guidance" <<<"$output"
          done
          test ! -e config-ci/proxy.db
          test ! -e config-ci/kernels

      - name: Start stack with the verified local build
        run: docker compose --profile local up -d --no-build

      - name: 验证源码构建镜像内的许可证与用户协议
        shell: bash
        run: |
          set -euo pipefail
          sha256sum LICENSE THIRD_PARTY_NOTICES.md USER_AGREEMENT.md licenses/SING-BOX-GPL-3.0.txt |
            docker compose --profile local exec -T sb-proxy-local sh -ec '
              cd /app
              test -s LICENSE
              test -s THIRD_PARTY_NOTICES.md
              test -s USER_AGREEMENT.md
              test -s licenses/SING-BOX-GPL-3.0.txt
              sha256sum -c -
            '

      - name: Wait for public health endpoint and Docker health status
        run: |
          container=$(docker compose --profile local ps -q sb-proxy-local)
          test -n "$container"
          for _ in $(seq 1 60); do
            if status=$(curl --noproxy '*' --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:38080/api/health) &&
               [ "$status" = 200 ] && [ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Service is not ready in time" >&2
          docker compose logs
          exit 1

      - name: Validate login + import + live sing-box chain
        run: |
          mkdir -p /tmp/sbpm-live-target
          printf 'sbpm-live-proxy-ok\n' >/tmp/sbpm-live-target/index.html
          python3 -m http.server 39090 --bind 127.0.0.1 \
            --directory /tmp/sbpm-live-target >/tmp/sbpm-live-target.log 2>&1 &
          echo "$!" >/tmp/sbpm-live-target.pid

          cat >/tmp/sbpm-ci-ss-upstream.json <<'JSON'
          {
            "log": {"level": "warn"},
            "inbounds": [
              {
                "type": "shadowsocks",
                "tag": "ss-in",
                "listen": "127.0.0.1",
                "listen_port": 39091,
                "method": "aes-128-gcm",
                "password": "ci-ss-password"
              }
            ],
            "outbounds": [{"type": "direct", "tag": "direct"}],
            "route": {"final": "direct"}
          }
          JSON
          chmod +x "${RUNNER_TEMP}/sing-box-kernel/sing-box"
          "${RUNNER_TEMP}/sing-box-kernel/sing-box" run -c /tmp/sbpm-ci-ss-upstream.json >/tmp/sbpm-ci-ss-upstream.log 2>&1 &
          echo "$!" >/tmp/sbpm-ci-ss-upstream.pid
          sleep 1
          kill -0 "$(cat /tmp/sbpm-ci-ss-upstream.pid)"

          curl -fsS http://127.0.0.1:38080/api/version --output /tmp/version.json
          cat /tmp/version.json
          jq -e --arg expected "$(cat internal/version/version.txt)" \
            '.version == $expected' /tmp/version.json
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:38080/api/login \
            -H 'Content-Type: application/json' \
            -d '{"password":"system-test-password"}' | jq -r '.token')
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:38080/api/settings >/tmp/settings.json

          IMPORT_RESULT=$(curl -fsS -X POST http://127.0.0.1:38080/api/nodes/batch-import \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"content":"socks5://127.0.0.1:9#ci-system-socks","enabled":true}')
          printf '%s\n' "$IMPORT_RESULT" >/tmp/batch-import.json
          jq -e '.success == 1 and .failed == 0' /tmp/batch-import.json >/dev/null

          SS_CREDENTIALS=$(printf 'aes-128-gcm:ci-ss-password' \
            | base64 --wrap=0 | tr '+/' '-_' | tr -d '=')
          SS_LINK="ss://${SS_CREDENTIALS}@127.0.0.1:39091#ci-system-ss"
          SS_IMPORT=$(jq -n --arg link "$SS_LINK" '{links: [$link], enabled: true}' \
            | curl -fsS -X POST http://127.0.0.1:38080/api/nodes/batch-import \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Content-Type: application/json' \
                --data-binary @-)
          printf '%s\n' "$SS_IMPORT" >/tmp/ss-import.json
          jq -e '.success == 1 and .failed == 0' /tmp/ss-import.json >/dev/null
          SS_PORT=$(echo "$SS_IMPORT" | jq -er '.results[0].port | select(. > 0)')
          SS_USER=$(echo "$SS_IMPORT" | jq -er '.results[0].username | select(length > 0)')
          SS_PASS=$(echo "$SS_IMPORT" | jq -er '.results[0].password | select(length > 0)')

          SS_RESULT=$(curl -fsS --noproxy '' \
            --proxy "http://127.0.0.1:${SS_PORT}" \
            --proxy-user "${SS_USER}:${SS_PASS}" \
            http://127.0.0.1:39090/)
          test "$SS_RESULT" = "sbpm-live-proxy-ok"

          curl -fsS -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:38080/api/nodes >/tmp/nodes.json
          jq -e '[.[] | select(.name == "ci-system-socks" and .type == "socks5" and .enabled == true)] | length == 1' \
            /tmp/nodes.json >/dev/null

          DIRECT_NODE=$(curl -fsS -X POST http://127.0.0.1:38080/api/nodes \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-system-direct","type":"direct","config":"{}","username":"ci-live-user","password":"ci-live-pass","tcp_reuse_enabled":true,"enabled":true}')
          printf '%s\n' "$DIRECT_NODE" >/tmp/direct-node.json
          DIRECT_PORT=$(echo "$DIRECT_NODE" | jq -er '.inbound_port | select(. > 0)')

          HTTP_RESULT=$(curl -fsS --noproxy '' \
            --proxy "http://127.0.0.1:${DIRECT_PORT}" \
            --proxy-user 'ci-live-user:ci-live-pass' \
            http://127.0.0.1:39090/)
          test "$HTTP_RESULT" = "sbpm-live-proxy-ok"

          SOCKS_RESULT=$(curl -fsS --noproxy '' \
            --socks5-hostname "127.0.0.1:${DIRECT_PORT}" \
            --proxy-user 'ci-live-user:ci-live-pass' \
            http://127.0.0.1:39090/)
          test "$SOCKS_RESULT" = "sbpm-live-proxy-ok"

          docker compose --profile local exec -T sb-proxy-local \
            sh -c '/app/config/kernels/sing-box-* check -c /app/config/config.json'
          docker compose --profile local top sb-proxy-local | grep -E '[s]ing-box-[a-f0-9]+'

      - name: Stop stack
        if: always()
        run: |
          if test -f /tmp/sbpm-live-target.pid; then
            kill "$(cat /tmp/sbpm-live-target.pid)" 2>/dev/null || true
          fi
          if test -f /tmp/sbpm-ci-ss-upstream.pid; then
            kill "$(cat /tmp/sbpm-ci-ss-upstream.pid)" 2>/dev/null || true
          fi
          docker compose --profile local down -v

  test-release-image-build:
    runs-on: ubuntu-latest
    needs: [release-plan, test-system-local-deploy, test-frontend-build, build-test-kernel]
    env:
      APP_VERSION: ${{ needs.release-plan.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build linux release binaries for image test
        run: |
          mkdir -p release-binaries
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="${arch}" ./scripts/build-release.sh "${PWD}/release-binaries/singbox-proxy-manager-linux-${arch}"
          done

      - name: 验证单文件启动、代理转发、数据保留和内核自愈
        run: |
          for custom_config in 0 1; do
            SBPM_RELEASE_TEST_CUSTOM_CONFIG="$custom_config" python3 "${PWD}/scripts/test-release.py" "${PWD}/release-binaries/singbox-proxy-manager-linux-amd64"
          done

      - uses: actions/download-artifact@v4
        with:
          name: sing-box-test-kernel
          path: ${{ runner.temp }}/sing-box-kernel

      - name: 验证从分组迁移前的发行版本原地升级
        run: |
          legacy_dir="${RUNNER_TEMP}/sbpm-v1.7.29"
          mkdir -p "$legacy_dir"
          git archive 84fb58e730f859c7226fecbaba15a453a9c269bb | tar -x -C "$legacy_dir"
          cp -R frontend/dist "$legacy_dir/frontend/dist"
          CGO_ENABLED=0 go build -C "$legacy_dir" -tags frontend_dist -o "${RUNNER_TEMP}/legacy-manager" ./backend
          chmod +x "${RUNNER_TEMP}/sing-box-kernel/sing-box"
          python3 scripts/test-release.py release-binaries/singbox-proxy-manager-linux-amd64 "${RUNNER_TEMP}/legacy-manager" "${RUNNER_TEMP}/sing-box-kernel/sing-box"

      - name: 验证统一发行文件的浏览器协议导入全链路
        working-directory: frontend
        env:
          SBPM_E2E_BACKEND_BINARY: ${{ github.workspace }}/release-binaries/singbox-proxy-manager-linux-amd64
          SINGBOX_TEST_BINARY: ${{ runner.temp }}/sing-box-kernel/sing-box
        run: |
          chmod +x "$SINGBOX_TEST_BINARY"
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)"
          npm run test:e2e:full-stack-protocol-import

      - name: 验证统一发行文件的完整系统交互
        working-directory: frontend
        env:
          SBPM_E2E_BACKEND_BINARY: ${{ github.workspace }}/release-binaries/singbox-proxy-manager-linux-amd64
          SINGBOX_TEST_BINARY: ${{ runner.temp }}/sing-box-kernel/sing-box
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)"
          npm run test:e2e:full-stack-system
          npm run test:e2e:full-stack-node-list
          npm run test:e2e:full-stack-features

      - name: 验证预压缩静态资源与真实浏览器协商
        working-directory: frontend
        env:
          SBPM_TEST_BINARY: ${{ github.workspace }}/release-binaries/singbox-proxy-manager-linux-amd64
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)"
          npm run test:e2e:precompressed-static

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile.release multi-arch build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: false
          platforms: linux/amd64,linux/arm64

      - name: 加载发行镜像用于验收
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          load: true
          tags: sbpm-release-license-test:ci

      - name: 验证发行镜像内的许可证、用户协议与健康探针
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect --format 'Alpine release image: {{.Size}} bytes' sbpm-release-license-test:ci
          gzip_bytes=$(docker save sbpm-release-license-test:ci | gzip -c | wc -c)
          echo "Alpine release image (docker save + gzip): $gzip_bytes bytes"
          sha256sum LICENSE THIRD_PARTY_NOTICES.md USER_AGREEMENT.md licenses/SING-BOX-GPL-3.0.txt |
            docker run --rm -i --entrypoint sh sbpm-release-license-test:ci -ec '
              cd /app
              test -s LICENSE
              test -s THIRD_PARTY_NOTICES.md
              test -s USER_AGREEMENT.md
              test -s licenses/SING-BOX-GPL-3.0.txt
              sha256sum -c -
            '
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' sbpm-release-license-test:ci)" = \
            '["CMD","/app/singbox-proxy-manager","--healthcheck"]'
          container=$(docker run -d -e ACCEPT_USER_AGREEMENT=true -e ADMIN_PASSWORD="$(openssl rand -hex 24)" sbpm-release-license-test:ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container" /app/singbox-proxy-manager --healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Upload verified Linux amd64 binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: singbox-proxy-manager-linux-amd64
          path: release-binaries/singbox-proxy-manager-linux-amd64
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload verified Linux arm64 binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: singbox-proxy-manager-linux-arm64
          path: release-binaries/singbox-proxy-manager-linux-arm64
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build-binaries:
    runs-on: ubuntu-latest
    needs: [release-plan, test-frontend-build, test-release-image-build]
    if: needs.release-plan.outputs.should_release == 'true'
    env:
      APP_VERSION: ${{ needs.release-plan.outputs.app_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: |
          mkdir -p release-binaries
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            ./scripts/build-release.sh "${PWD}/release-binaries/singbox-proxy-manager-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: singbox-proxy-manager-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            release-binaries/singbox-proxy-manager-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build-ghcr:
    concurrency:
      group: ghcr-${{ needs.release-plan.outputs.should_release == 'true' && needs.release-plan.outputs.release_tag || 'edge' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [release-plan, test-release-image-build]
    if: github.event_name == 'push' && needs.release-plan.outputs.run_full == 'true'
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      should_publish: ${{ steps.publish.outputs.should_publish }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: singbox-proxy-manager-linux-*
          path: release-binaries
          merge-multiple: true

      - name: Verify required Linux artifacts
        run: |
          for arch in amd64 arm64; do
            test -s "release-binaries/singbox-proxy-manager-linux-${arch}"
          done
          chmod +x release-binaries/singbox-proxy-manager-linux-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 锁内读取发行标签并选择镜像版本
        id: publish
        env:
          APP_VERSION: ${{ needs.release-plan.outputs.app_version }}
          SHOULD_RELEASE: ${{ needs.release-plan.outputs.should_release }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin --tags --force
          python3 scripts/publish_tags.py --check-image >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        id: push
        if: steps.publish.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.publish.outputs.build_tag }}
          provenance: mode=max
          sbom: true
          annotations: index:org.opencontainers.image.revision=${{ steps.publish.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-plan.outputs.app_version }}
            org.opencontainers.image.revision=${{ steps.publish.outputs.revision }}
            org.opencontainers.image.description=SingBox Proxy Manager multi-arch image (linux/amd64, linux/arm64)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup legacy SHA and unreferenced untagged GHCR versions
        if: steps.publish.outputs.should_publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner_type="users"
          if [ "${GITHUB_REPOSITORY_OWNER_ID:-}" != "" ] && gh api "/orgs/${GITHUB_REPOSITORY_OWNER}" >/dev/null 2>&1; then
            owner_type="orgs"
          fi
          python3 scripts/cleanup-ghcr-packages.py \
            --repository "${GITHUB_REPOSITORY}" \
            --package "${GITHUB_REPOSITORY#*/}" \
            --owner-type "${owner_type}" \
            --min-age-seconds 3600

  create-release:
    concurrency:
      group: github-release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [release-plan, test-release-image-build, build-binaries, build-ghcr]
    if: needs.release-plan.outputs.should_release == 'true' && needs.build-ghcr.outputs.should_publish == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: singbox-proxy-manager-*
          path: release-binaries
          merge-multiple: true

      - name: Prepare checksums
        run: |
          for os in linux freebsd darwin; do
            for arch in amd64 arm64; do
              test -s "release-binaries/singbox-proxy-manager-${os}-${arch}"
            done
          done
          chmod +x release-binaries/singbox-proxy-manager-*
          (cd release-binaries && sha256sum singbox-proxy-manager-* > checksums.txt)

      - name: 锁内计算本次发行可推进的滚动标签
        id: publish
        env:
          APP_VERSION: ${{ needs.release-plan.outputs.app_version }}
          SHOULD_RELEASE: ${{ needs.release-plan.outputs.should_release }}
        run: |
          git fetch origin --tags --force
          python3 scripts/publish_tags.py >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.publish.outputs.should_publish == 'true'
        env:
          APP_VERSION: ${{ needs.release-plan.outputs.app_version }}
        run: |
          python3 scripts/generate-release-notes.py --version "$APP_VERSION" \
            --repository "$GITHUB_REPOSITORY" --server-url "$GITHUB_SERVER_URL" \
            --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/release-notes.md"

      - name: Create or update release
        if: steps.publish.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-plan.outputs.release_tag }}
          name: ${{ needs.release-plan.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            release-binaries/singbox-proxy-manager-*
            release-binaries/checksums.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
            USER_AGREEMENT.md
            licenses/SING-BOX-GPL-3.0.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ needs.release-plan.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.publish.outputs.make_latest }}

      - uses: docker/login-action@v3
        if: steps.publish.outputs.should_publish == 'true' && steps.publish.outputs.rolling != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推进本次正式版的滚动镜像标签
        if: steps.publish.outputs.should_publish == 'true' && steps.publish.outputs.rolling != ''
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          ROLLING: ${{ steps.publish.outputs.rolling }}
          DIGEST: ${{ needs.build-ghcr.outputs.digest }}
        run: |
          args=()
          for tag in $ROLLING; do args+=(-t "$IMAGE:$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"

  cleanup-artifacts:
    runs-on: ubuntu-latest
    needs: [release-plan, vulnerability-backend, test-backend, test-upstream-full-stack, test-system-local-deploy, test-release-image-build, build-binaries, create-release, build-ghcr]
    if: always() && needs.release-plan.outputs.run_full == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: write
    steps:
      - name: 清理本次运行的临时 Artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VULN_RESULT: ${{ needs.vulnerability-backend.result }}
          TEST_BACKEND_RESULT: ${{ needs.test-backend.result }}
          UPSTREAM_RESULT: ${{ needs.test-upstream-full-stack.result }}
          SYSTEM_RESULT: ${{ needs.test-system-local-deploy.result }}
          RELEASE_IMAGE_RESULT: ${{ needs.test-release-image-build.result }}
          PLAN_RESULT: ${{ needs.release-plan.result }}
          SHOULD_RELEASE: ${{ needs.release-plan.outputs.should_release }}
          BUILD_BINARIES_RESULT: ${{ needs.build-binaries.result }}
          CREATE_RELEASE_RESULT: ${{ needs.create-release.result }}
          GHCR_RESULT: ${{ needs.build-ghcr.result }}
        run: |
          artifact_list="${RUNNER_TEMP}/sbpm-run-artifacts.tsv"
          api_error="${RUNNER_TEMP}/sbpm-artifact-api-error.log"
          trap 'rm -f "$artifact_list" "$api_error"' EXIT

          if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name] | @tsv' >"$artifact_list" 2>"$api_error"; then
            if ! grep -q 'HTTP 404' "$api_error"; then
              echo '::warning::无法读取本次运行的 Artifacts，保留至自动过期'
            fi
            exit 0
          fi

          all_succeeded() {
            for status in "$@"; do
              test "$status" = "success" || return 1
            done
          }

          while IFS=$'\t' read -r artifact_id artifact_name; do
            case "$artifact_name" in
              sing-box-test-kernel)
                all_succeeded "$VULN_RESULT" "$TEST_BACKEND_RESULT" "$UPSTREAM_RESULT" "$SYSTEM_RESULT" "$RELEASE_IMAGE_RESULT" || continue
                ;;
              frontend-dist)
                all_succeeded "$PLAN_RESULT" "$UPSTREAM_RESULT" "$RELEASE_IMAGE_RESULT" || continue
                if [ "$SHOULD_RELEASE" = "true" ]; then
                  test "$BUILD_BINARIES_RESULT" = "success" || continue
                else
                  test "$BUILD_BINARIES_RESULT" = "skipped" || continue
                fi
                ;;
              singbox-proxy-manager-*)
                all_succeeded "$PLAN_RESULT" "$GHCR_RESULT" || continue
                if [ "$SHOULD_RELEASE" = "true" ]; then
                  test "$CREATE_RELEASE_RESULT" = "success" || continue
                fi
                ;;
              *) continue ;;
            esac

            if gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              >/dev/null 2>"$api_error"; then
              echo "已删除临时 Artifact：${artifact_name}"
            elif ! grep -q 'HTTP 404' "$api_error"; then
              echo "::warning::无法删除临时 Artifact：${artifact_name}，保留至自动过期"
            fi
          done <"$artifact_list"
