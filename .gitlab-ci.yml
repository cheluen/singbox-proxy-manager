stages:
  - lint
  - test
  - build
  - release

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  GOVULNCHECK_VERSION: v1.7.0
  GOTOOLCHAIN: local

# Go代码lint检查
lint-backend:
  stage: lint
  image: golangci/golangci-lint:v2.12.0
  script:
    - golangci-lint run ./backend/... ./internal/...
  only:
    changes:
      - backend/**/*
      - internal/**/*
      - scripts/**/*
      - go.mod
      - go.sum
      - .golangci.yml
    refs:
      - main
      - merge_requests
  allow_failure: false

# 前端ESLint检查
lint-frontend:
  stage: lint
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint
  cache:
    key: npm-modules
    paths:
      - frontend/node_modules/
  only:
    changes:
      - frontend/**/*
    refs:
      - main
      - merge_requests
  allow_failure: false

# 后端可达漏洞扫描
vulnerability-backend:
  stage: test
  image: golang:1.26.10
  script:
    - GOBIN="$CI_PROJECT_DIR/.ci-bin" go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
    - CGO_ENABLED=0 go build -o "$CI_PROJECT_DIR/.ci-bin/sbpm-govulncheck-target" ./backend
    - $CI_PROJECT_DIR/.ci-bin/govulncheck -mode=binary "$CI_PROJECT_DIR/.ci-bin/sbpm-govulncheck-target"
    - ./scripts/build-sing-box.sh "$CI_PROJECT_DIR/.ci-bin/sing-box"
    - $CI_PROJECT_DIR/.ci-bin/govulncheck -mode=binary -json "$CI_PROJECT_DIR/.ci-bin/sing-box" > "$CI_PROJECT_DIR/.ci-bin/sing-box-vulnerabilities.json"
    - |
      if grep -F '"osv": "GO-2026-6809"' "$CI_PROJECT_DIR/.ci-bin/sing-box-vulnerabilities.json"; then
        echo 'CVE-2026-111943 仍然存在' >&2
        exit 1
      fi
  only:
    changes:
      - backend/**/*
      - internal/**/*
      - scripts/**/*
      - go.mod
      - go.sum
      - .gitlab-ci.yml
    refs:
      - main
      - merge_requests
  allow_failure: false

# 后端Go编译测试
test-backend:
  stage: test
  image: golang:1.26.10
  script:
    - go mod download
    - CGO_ENABLED=0 go build -o main ./backend
    - ./scripts/build-sing-box.sh "$CI_PROJECT_DIR/.ci-bin/sing-box"
    - export SINGBOX_TEST_BINARY="$CI_PROJECT_DIR/.ci-bin/sing-box"
    - go test -race -count=1 ./backend/... ./internal/... -v
  cache:
    key: go-modules
    paths:
      - /go/pkg/mod/
  only:
    changes:
      - backend/**/*
      - internal/**/*
      - scripts/**/*
      - go.mod
      - go.sum
    refs:
      - main
      - merge_requests

# 前端构建测试
test-frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  cache:
    key: npm-modules
    paths:
      - frontend/node_modules/
  only:
    changes:
      - frontend/**/*
    refs:
      - main
      - merge_requests

# 构建并推送Docker镜像
build-docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  only:
    - main
  when: on_success
  needs:
    - job: test-backend
      optional: true
    - job: test-frontend
      optional: true

# 带版本标签的发布构建
build-release:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_TAG .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

# 构建前端（供其他job使用）
build-frontend-dist:
  stage: build
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test:version-sync
    - npm run build
    - echo "AUTO_TAG=v$(cat "$CI_PROJECT_DIR/internal/version/version.txt")" > "$CI_PROJECT_DIR/release-version.env"
  artifacts:
    reports:
      dotenv: release-version.env
    paths:
      - frontend/dist/
    expire_in: 1 day
  only:
    - main
    - tags

# 构建FreeBSD完整发布包
build-freebsd:
  stage: build
  image: golang:1.26.10
  needs:
    - job: build-frontend-dist
      artifacts: true
  variables:
    SINGBOX_VERSION: "1.12.12"
  script:
    - go mod download
    - GOOS=freebsd GOARCH=amd64 ./scripts/build-release.sh "$CI_PROJECT_DIR/singbox-proxy-manager-freebsd-amd64"
  artifacts:
    name: "singbox-proxy-manager-freebsd-$CI_COMMIT_SHORT_SHA"
    paths:
      - singbox-proxy-manager-freebsd-amd64
    expire_in: 30 days
  only:
    - main
    - tags

# 构建Linux完整发布包
build-linux:
  stage: build
  image: golang:1.26.10
  needs:
    - job: build-frontend-dist
      artifacts: true
  variables:
    SINGBOX_VERSION: "1.12.12"
  script:
    - go mod download
    - GOOS=linux GOARCH=amd64 ./scripts/build-release.sh "$CI_PROJECT_DIR/singbox-proxy-manager-linux-amd64"
  artifacts:
    name: "singbox-proxy-manager-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - singbox-proxy-manager-linux-amd64
    expire_in: 30 days
  only:
    - main
    - tags

# 自动发布到Releases（main分支push时自动创建tag并发布）
auto-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build-frontend-dist
      artifacts: true
    - job: build-freebsd
      artifacts: false
    - job: build-linux
      artifacts: false
  script:
    - echo "Auto-creating release ${AUTO_TAG} for commit ${CI_COMMIT_SHORT_SHA}"
  release:
    tag_name: $AUTO_TAG
    name: "Auto Release ${AUTO_TAG}"
    description: |
      ## 自动构建版本 ${AUTO_TAG}
      
      Commit: ${CI_COMMIT_SHORT_SHA}
      
      ### 完整发布包（开箱即用）
      
      包含：单文件管理程序（内置前端与 sing-box，启动时自动释放内核）
      
      | 平台 | 下载 |
      |------|------|
      | Linux (amd64) | singbox-proxy-manager-linux-amd64 |
      | FreeBSD (amd64) | singbox-proxy-manager-freebsd-amd64 |
      | Docker | `docker pull ${CI_REGISTRY_IMAGE}:latest` |
      
      ### 使用方法
      ```bash
      chmod +x singbox-proxy-manager-linux-amd64
      ADMIN_PASSWORD=your_password ./singbox-proxy-manager-linux-amd64
      # 访问 http://localhost:30000
      ```
    assets:
      links:
        - name: "singbox-proxy-manager-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/singbox-proxy-manager-linux-amd64?job=build-linux"
          link_type: package
        - name: "singbox-proxy-manager-freebsd-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/singbox-proxy-manager-freebsd-amd64?job=build-freebsd"
          link_type: package
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

# 注意：release-binaries job已移除
# 因为auto-release会在push到main时自动创建tag和release
# 如需手动发布，请直接在GitLab UI创建release或使用auto-release生成的release
