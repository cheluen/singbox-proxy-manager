stages:
  - lint
  - test
  - build
  - release

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  GO_VERSION: "1.26.11"
  GOVULNCHECK_VERSION: v1.7.0
  GOTOOLCHAIN: local
  GOMODCACHE: $CI_PROJECT_DIR/.ci-cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.ci-cache/go-build
  GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.ci-cache/golangci-lint
  npm_config_cache: $CI_PROJECT_DIR/.ci-cache/npm

.go-cache:
  cache: &go-cache
    key: go-v2-$GO_VERSION-$GO_CACHE_PROFILE-$CI_COMMIT_REF_SLUG
    fallback_keys:
      - go-v2-$GO_VERSION-$GO_CACHE_PROFILE-$CI_DEFAULT_BRANCH
    paths:
      - .ci-cache/go-mod/
      - .ci-cache/go-build/
    policy: pull-push

.npm-cache:
  cache: &npm-cache
    key: npm-v2-node22-alpine-$CI_COMMIT_REF_SLUG
    fallback_keys:
      - npm-v2-node22-alpine-$CI_DEFAULT_BRANCH
    paths:
      - .ci-cache/npm/
    policy: pull

.docker-build:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --name sbpm-ci --driver docker-container --use
    - docker buildx inspect --bootstrap
  after_script:
    - docker buildx rm sbpm-ci

# Go代码lint检查
lint-backend:
  extends: .go-cache
  stage: lint
  image: golangci/golangci-lint:v2.12.0
  needs: []
  variables:
    GO_CACHE_PROFILE: lint-linux-amd64-golangci-v2.12.0
  cache:
    <<: *go-cache
    paths:
      - .ci-cache/go-mod/
      - .ci-cache/go-build/
      - .ci-cache/golangci-lint/
  script:
    - golangci-lint run ./backend/... ./internal/...
  rules:
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - internal/**/*
        - scripts/**/*
        - go.mod
        - go.sum
        - .golangci.yml
  allow_failure: false

# 前端ESLint检查
lint-frontend:
  extends: .npm-cache
  stage: lint
  image: node:22-alpine
  needs: []
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run lint
  rules: &frontend-rules
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
  allow_failure: false

build-test-kernel:
  extends: .go-cache
  stage: .pre
  image: golang:$GO_VERSION
  needs: []
  variables:
    GO_CACHE_PROFILE: kernel-linux-amd64
  script:
    - ./scripts/build-sing-box.sh "$CI_PROJECT_DIR/.ci-bin/sing-box"
  artifacts:
    paths:
      - .ci-bin/sing-box
    expire_in: 1 day
  rules: &test-kernel-rules
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - internal/**/*
        - scripts/**/*
        - USER_AGREEMENT.md
        - go.mod
        - go.sum
        - .gitlab-ci.yml

# 后端可达漏洞扫描
vulnerability-backend:
  extends: .go-cache
  stage: test
  image: golang:$GO_VERSION
  needs:
    - job: build-test-kernel
      artifacts: true
  variables:
    GO_CACHE_PROFILE: vuln-linux-amd64-govulncheck-v1.7.0
  before_script: &verify-test-kernel
    - chmod +x .ci-bin/sing-box
    - ./scripts/verify-go-build.sh "$CI_PROJECT_DIR/.ci-bin/sing-box"
  script:
    - GOBIN="$CI_PROJECT_DIR/.ci-bin" go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
    - CGO_ENABLED=0 go build -o "$CI_PROJECT_DIR/.ci-bin/sbpm-govulncheck-target" ./backend
    - $CI_PROJECT_DIR/.ci-bin/govulncheck -mode=binary "$CI_PROJECT_DIR/.ci-bin/sbpm-govulncheck-target"
    - $CI_PROJECT_DIR/.ci-bin/govulncheck -mode=binary -json "$CI_PROJECT_DIR/.ci-bin/sing-box" > "$CI_PROJECT_DIR/.ci-bin/sing-box-vulnerabilities.json"
    - |
      if grep -E '"osv": "GO-2026-(6809|6859)"' "$CI_PROJECT_DIR/.ci-bin/sing-box-vulnerabilities.json"; then
        echo 'CVE-2026-111943 或 CVE-2026-97054 仍然存在' >&2
        exit 1
      fi
  rules: *test-kernel-rules
  allow_failure: false

# 后端Go编译测试
test-backend:
  extends: .go-cache
  stage: test
  image: golang:$GO_VERSION
  needs:
    - job: build-test-kernel
      artifacts: true
  variables:
    GO_CACHE_PROFILE: backend-linux-amd64
  before_script: *verify-test-kernel
  script:
    - cmp USER_AGREEMENT.md internal/agreement/user_agreement.md
    - go mod download
    - CGO_ENABLED=0 go build -o /dev/null ./backend
    - export SINGBOX_TEST_BINARY="$CI_PROJECT_DIR/.ci-bin/sing-box"
    - go test -race -count=1 ./backend/... ./internal/... -v
  rules: *test-kernel-rules

# 前端构建测试
test-frontend:
  extends: .npm-cache
  stage: test
  image: node:22-alpine
  needs: []
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run test:core
    - npm run audit
    - npm run test:version-sync
    - npm run build
  cache:
    <<: *npm-cache
    policy: pull-push
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day
  rules: *frontend-rules

quality-gate:
  stage: test
  image: alpine:3.22
  needs:
    - job: lint-backend
      artifacts: false
    - job: lint-frontend
      artifacts: false
    - job: test-backend
      artifacts: false
    - job: vulnerability-backend
      artifacts: false
    - job: test-frontend
      artifacts: false
  script:
    - printf '%s\n' '后端、前端与漏洞扫描均已通过，允许发布'
  rules:
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main"'
  allow_failure: false

# 构建并推送Docker镜像
build-docker:
  extends: .docker-build
  stage: build
  script:
    - docker buildx build --load --cache-from "type=registry,ref=$DOCKER_IMAGE:ci-source-cache-v1" --cache-to "type=registry,ref=$DOCKER_IMAGE:ci-source-cache-v1,mode=max" -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  only:
    - main
  when: on_success
  needs:
    - job: quality-gate
      artifacts: false

# 带版本标签的发布构建
build-release:
  extends: .docker-build
  stage: build
  needs:
    - job: quality-gate
      artifacts: false
  script:
    - docker buildx build --load --cache-from "type=registry,ref=$DOCKER_IMAGE:ci-source-cache-v1" --cache-to "type=registry,ref=$DOCKER_IMAGE:ci-source-cache-v1,mode=max" -t $DOCKER_IMAGE:$CI_COMMIT_TAG .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

# 构建FreeBSD完整发布包
build-freebsd:
  extends: .go-cache
  stage: build
  image: golang:$GO_VERSION
  variables:
    GO_CACHE_PROFILE: release-freebsd-amd64
  needs:
    - job: test-frontend
      artifacts: true
  script:
    - cmp USER_AGREEMENT.md internal/agreement/user_agreement.md
    - go mod download
    - GOOS=freebsd GOARCH=amd64 ./scripts/build-release.sh "$CI_PROJECT_DIR/singbox-proxy-manager-freebsd-amd64"
  artifacts:
    name: "singbox-proxy-manager-freebsd-$CI_COMMIT_SHORT_SHA"
    paths:
      - singbox-proxy-manager-freebsd-amd64
      - USER_AGREEMENT.md
    expire_in: 30 days
  only:
    - main
    - tags

# 构建Linux完整发布包
build-linux:
  extends: .go-cache
  stage: build
  image: golang:$GO_VERSION
  variables:
    GO_CACHE_PROFILE: release-linux-amd64
  needs:
    - job: test-frontend
      artifacts: true
  script:
    - cmp USER_AGREEMENT.md internal/agreement/user_agreement.md
    - go mod download
    - GOOS=linux GOARCH=amd64 ./scripts/build-release.sh "$CI_PROJECT_DIR/singbox-proxy-manager-linux-amd64"
  artifacts:
    name: "singbox-proxy-manager-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - singbox-proxy-manager-linux-amd64
      - USER_AGREEMENT.md
    expire_in: 30 days
  only:
    - main
    - tags

read-release-version:
  stage: .pre
  image: alpine:3.22
  needs: []
  script:
    - printf 'AUTO_TAG=v%s\n' "$(cat internal/version/version.txt)" > release-version.env
  artifacts:
    reports:
      dotenv: release-version.env
    expire_in: 1 day
  rules: &main-push
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

# 自动发布到Releases（main分支push时自动创建tag并发布）
auto-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: quality-gate
      artifacts: false
    - job: read-release-version
      artifacts: true
    - job: build-freebsd
      artifacts: false
    - job: build-linux
      artifacts: false
    - job: build-docker
      artifacts: false
  script:
    - test -s LICENSE
    - test -s THIRD_PARTY_NOTICES.md
    - cmp USER_AGREEMENT.md internal/agreement/user_agreement.md
    - test -s licenses/SING-BOX-GPL-3.0.txt
    - echo "Auto-creating release ${AUTO_TAG} for commit ${CI_COMMIT_SHORT_SHA}"
  release:
    tag_name: $AUTO_TAG
    name: "Auto Release ${AUTO_TAG}"
    description: |
      ## 自动构建版本 ${AUTO_TAG}
      
      Commit: ${CI_COMMIT_SHORT_SHA}
      
      ### 完整发布包（开箱即用）
      
      包含：单文件管理程序（内置前端与 sing-box，启动时自动释放内核）
      
      | 平台 | 下载 |
      |------|------|
      | Linux (amd64) | singbox-proxy-manager-linux-amd64 |
      | FreeBSD (amd64) | singbox-proxy-manager-freebsd-amd64 |
      | Docker | `docker pull ${CI_REGISTRY_IMAGE}:latest` |
      
      ### 使用方法
      首次运行请先阅读 [USER_AGREEMENT.md](${CI_PROJECT_URL}/-/blob/${CI_COMMIT_SHA}/USER_AGREEMENT.md)，并在终端提示处输入 `y`。Docker 或非交互式部署请在同意后设置 `ACCEPT_USER_AGREEMENT=true`。

      ```bash
      chmod +x singbox-proxy-manager-linux-amd64
      ADMIN_PASSWORD=your_password ./singbox-proxy-manager-linux-amd64
      # 访问 http://localhost:30000
      ```

      ### 第三方许可证与对应源码

      内置的独立内核 sing-box v1.12.12 由 nekohasekai 持有版权（Copyright (C) 2022 by nekohasekai <contact-sagernet@sekai.icu>），按 GPL-3.0-or-later 分发。SingBox Proxy Manager 与 sing-box、SagerNet 和 nekohasekai 没有官方隶属、赞助或背书关系。

      [官方源码与固定提交](https://github.com/SagerNet/sing-box/tree/54ed58499d7063136ed52dabf87d179d252425d0) · [对应源码 tar.gz](https://github.com/SagerNet/sing-box/archive/54ed58499d7063136ed52dabf87d179d252425d0.tar.gz) · [第三方声明与重编译说明](${CI_PROJECT_URL}/-/blob/${CI_COMMIT_SHA}/THIRD_PARTY_NOTICES.md) · [GPL v3 正文](${CI_PROJECT_URL}/-/blob/${CI_COMMIT_SHA}/licenses/SING-BOX-GPL-3.0.txt)
    assets:
      links:
        - name: "singbox-proxy-manager-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/singbox-proxy-manager-linux-amd64?job=build-linux"
          link_type: package
        - name: "singbox-proxy-manager-freebsd-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/singbox-proxy-manager-freebsd-amd64?job=build-freebsd"
          link_type: package
        - name: "LICENSE"
          url: "${CI_PROJECT_URL}/-/raw/${CI_COMMIT_SHA}/LICENSE"
          link_type: other
        - name: "THIRD_PARTY_NOTICES.md"
          url: "${CI_PROJECT_URL}/-/raw/${CI_COMMIT_SHA}/THIRD_PARTY_NOTICES.md"
          link_type: other
        - name: "USER_AGREEMENT.md"
          url: "${CI_PROJECT_URL}/-/raw/${CI_COMMIT_SHA}/USER_AGREEMENT.md"
          link_type: other
        - name: "SING-BOX-GPL-3.0.txt"
          url: "${CI_PROJECT_URL}/-/raw/${CI_COMMIT_SHA}/licenses/SING-BOX-GPL-3.0.txt"
          link_type: other
  rules: *main-push
